name: MarketIntel — Daily Analysis
on:
  schedule:
    - cron: "45 3 * * 1-5"   # 09:15 IST  Mon–Fri
    - cron: "30 14 * * 1-5"  # 09:30 EST  Mon–Fri
  workflow_dispatch:
    inputs:
      country:
        description: "Country to scan (ALL / IN / US)"
        required: false
        default: "ALL"
        type: choice
        options: ["ALL", "IN", "US"]
      timeframes:
        description: "Timeframes comma-separated: 15m,1H,1D,1W"
        required: false
        default: "15m,1H,1D,1W"
      sector:
        description: "Specific sector (leave blank for all)"
        required: false
        default: ""
      ticker:
        description: "Single ticker e.g. AAPL (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v3
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.50" "pandas>=2.0.0" "numpy>=1.24.0" "ta>=0.11.0" "requests>=2.28.0"

      - name: Verify installs
        run: |
          python -c "import yfinance; print('yfinance OK:', yfinance.__version__)"
          python -c "import pandas; print('pandas OK:', pandas.__version__)"
          python -c "import ta; import importlib.metadata; print('ta OK:', importlib.metadata.version('ta'))"
          python -c "import numpy; print('numpy OK:', numpy.__version__)"

      - name: Run MarketIntel Analysis
        run: |
          python alpha_screener.py \
            --country "${{ github.event.inputs.country || 'ALL' }}" \
            --timeframes "${{ github.event.inputs.timeframes || '15m,1H,1D,1W' }}" \
            --sector "${{ github.event.inputs.sector || '' }}" \
            --ticker "${{ github.event.inputs.ticker || '' }}" \
            --output docs/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "chore: auto-update analysis [skip ci]"
          force_orphan: false

      - name: Job Summary
        run: |
          echo "### ✅ MarketIntel Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Country: ${{ github.event.inputs.country || 'ALL' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timeframes: ${{ github.event.inputs.timeframes || '15m,1H,1D,1W' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
